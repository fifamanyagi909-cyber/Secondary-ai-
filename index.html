<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secondary AI</title>
    <style>
        /* Keeping your original beautiful styling */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --primary: #8b5cf6; --secondary: #a78bfa; --accent: #c4b5fd; --dark: #0a0a0a; --darker: #050505; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--darker); height: 100vh; display: flex; flex-direction: column; color: white; overflow: hidden; }
        .logo-container { position: relative; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; }
        .logo-eye { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%); border-radius: 50% 0 50% 50%; transform: rotate(-45deg); position: relative; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); animation: pulse 3s ease-in-out infinite; }
        .logo-eye::before { content: ''; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
        @keyframes pulse { 0%, 100% { transform: rotate(-45deg) scale(1); } 50% { transform: rotate(-45deg) scale(1.05); } }
        .header { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(139, 92, 246, 0.2); flex-shrink: 0; }
        .header-text { flex: 1; }
        .header h1 { font-size: 18px; font-weight: 600; background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 4px; }
        .status::before { content: ''; width: 5px; height: 5px; background: #10b981; border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; background: radial-gradient(ellipse at top, rgba(139, 92, 246, 0.08) 0%, transparent 50%); }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 18px; word-wrap: break-word; animation: slideIn 0.3s ease; position: relative; line-height: 1.4; font-size: 14px; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-message { align-self: flex-end; background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%); color: white; border-bottom-right-radius: 4px; }
        .bot-message { align-self: flex-start; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.95); border: 1px solid rgba(139, 92, 246, 0.15); border-bottom-left-radius: 4px; }
        .message-image { max-width: 100%; border-radius: 12px; margin-bottom: 8px; display: block; }
        .input-wrapper { background: rgba(10, 10, 10, 0.95); border-top: 1px solid rgba(139, 92, 246, 0.2); padding: 12px; flex-shrink: 0; }
        .input-container { display: flex; gap: 10px; align-items: flex-end; background: rgba(255,255,255,0.05); border-radius: 25px; padding: 6px; border: 1px solid rgba(139, 92, 246, 0.2); }
        #userInput { flex: 1; border: none; background: transparent; padding: 10px; outline: none; font-size: 15px; color: white; max-height: 100px; resize: none; font-family: inherit; }
        #sendBtn { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .image-preview-container { display: none; padding: 10px; background: rgba(139, 92, 246, 0.1); align-items: center; gap: 10px; }
        .image-preview-container.active { display: flex; }
        .preview-img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .typing { display: flex; gap: 5px; padding: 12px; background: rgba(255,255,255,0.06); border-radius: 18px; width: fit-content; }
        .dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-container"><div class="logo-eye"></div></div>
        <div class="header-text">
            <h1>Secondary</h1>
            <div class="status" id="statusIndicator">Online</div>
        </div>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="bot-message message">Hello! I'm fixed and ready to chat. How can I help you today?</div>
    </div>

    <div class="image-preview-container" id="imagePreviewContainer">
        <img class="preview-img" id="previewImg" src="">
        <span style="flex:1; font-size: 12px;">Image attached</span>
        <button onclick="removeImage()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
    </div>
    
    <div class="input-wrapper">
        <div class="input-container">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
            <button class="attach-btn" onclick="document.getElementById('fileInput').click()" style="background:none; border:none; color:var(--accent); cursor:pointer; padding-left:10px;">
                📎
            </button>
            <textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBe84HflKM43JPCMb2sItq3MoAl9HTFsfY';
        let selectedImage = null;
        let isProcessing = false;

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        // Handle Image Selection
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImage = e.target.result;
                document.getElementById('previewImg').src = selectedImage;
                document.getElementById('imagePreviewContainer').classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            selectedImage = null;
            document.getElementById('imagePreviewContainer').classList.remove('active');
        }

        // Send Message
        async function sendMessage() {
            const text = userInput.value.trim();
            if ((!text && !selectedImage) || isProcessing) return;

            isProcessing = true;
            addMessage(text, true, selectedImage);
            
            const currentText = text;
            const currentImg = selectedImage;

            userInput.value = '';
            removeImage();
            showTyping();

            try {
                // We use gemini-1.5-flash for reliability
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                
                let parts = [{ text: currentText || "Describe this image" }];
                if (currentImg) {
                    parts.push({
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: currentImg.split(',')[1]
                        }
                    });
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                removeTyping();

                if (data.candidates && data.candidates[0].content) {
                    addMessage(data.candidates[0].content.parts[0].text, false);
                } else {
                    throw new Error("Invalid response");
                }
            } catch (e) {
                removeTyping();
                addMessage("I'm sorry, I'm having trouble connecting. Please check your API key.", false);
            } finally {
                isProcessing = false;
            }
        }

        function addMessage(text, isUser, image = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            if (image) {
                const img = document.createElement('img');
                img.src = image;
                img.className = 'message-image';
                msgDiv.appendChild(img);
            }
            if (text) {
                const span = document.createElement('span');
                span.textContent = text;
                msgDiv.appendChild(span);
            }
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'typing';
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        // Allow Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
